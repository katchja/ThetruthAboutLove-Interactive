    <script>
      (function () {
        window.addEventListener(
          'unhandledrejection',
          function (event) {
            var r = event && event.reason;
            var msg = typeof r === 'string' ? r : r && r.message ? r.message : '';
            if (
              msg.indexOf('WebSocket') !== -1 ||
              msg.indexOf('vite-hmr') !== -1 ||
              msg.indexOf('AbortError') !== -1 ||
              msg.indexOf('NotAllowedError') !== -1
            ) {
              event.preventDefault();
              event.stopImmediatePropagation();
            }
          },
          true
        );
        var NativeWS = window.WebSocket;
        if (typeof NativeWS === 'function') {
          var PatchedWS = function (url, protocols) {
            var urlStr = String(url || '');
            var protoStr = Array.isArray(protocols) ? protocols.join(',') : String(protocols || '');
            if (protoStr.indexOf('vite-hmr') !== -1 || urlStr.indexOf(':24678') !== -1) {
              var dummy = new EventTarget();
              dummy.readyState = 1;
              dummy.protocol = 'vite-hmr';
              dummy.extensions = '';
              dummy.bufferedAmount = 0;
              dummy.binaryType = 'blob';
              dummy.url = urlStr;
              dummy.send = function () {};
              dummy.close = function () {
                dummy.readyState = 3;
              };
              setTimeout(function () {
                var evt = new Event('open');
                if (typeof dummy.onopen === 'function') dummy.onopen(evt);
                dummy.dispatchEvent(evt);
              }, 0);
              return dummy;
            }
            return protocols !== undefined ? new NativeWS(url, protocols) : new NativeWS(url);
          };
          PatchedWS.prototype = NativeWS.prototype;
          PatchedWS.CONNECTING = NativeWS.CONNECTING;
          PatchedWS.OPEN = NativeWS.OPEN;
          PatchedWS.CLOSING = NativeWS.CLOSING;
          PatchedWS.CLOSED = NativeWS.CLOSED;
          window.WebSocket = PatchedWS;
        }
      })();
    </script>
